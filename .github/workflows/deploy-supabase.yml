name: Deploy production

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep the old lock name so migration-only runs cannot overlap this release.
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run also fires for PR checks. Never expose database credentials to PRs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Reject stale checked commits
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" != "$VALIDATED_SHA" ]]; then
            echo '::notice::Skipping an outdated checked commit; a newer main commit owns the next release.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check deployment configuration
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo 'Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as production environment secrets, and SUPABASE_PROJECT_REF as a production environment variable.' >&2
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo 'SUPABASE_PROJECT_REF must be a 20-character Supabase project ref.' >&2
            exit 1
          fi
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as production environment secrets before merging.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        if: steps.revision.outputs.current == 'true'
        run: npm ci
      - name: Install Vercel CLI
        if: steps.revision.outputs.current == 'true'
        run: npm install --global vercel@65.16.0
      - name: Verify Vercel project access
        if: steps.revision.outputs.current == 'true'
        # Uses the configured project IDs without link's failing user lookup.
        # Pulled Secret placeholders must never be used for a local build.
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.revision.outputs.current == 'true'
        with:
          version: 2.118.0
      - name: Link production project
        if: steps.revision.outputs.current == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Review pending migrations in log
        if: steps.revision.outputs.current == 'true'
        run: supabase db push --linked --skip-vault --dry-run --yes
      - name: Apply pending migrations
        if: steps.revision.outputs.current == 'true'
        run: supabase db push --linked --skip-vault --yes
      - name: Deploy production application
        if: steps.revision.outputs.current == 'true'
        # Build on Vercel: pulled Secret values are [SENSITIVE] placeholders,
        # which Next.js would otherwise inline into NEXT_PUBLIC_* references.
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
