name: Recover Supabase migration baseline (one time)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPAIR-PRODUCTION-BASELINE after verifying the first three migrations already exist in production'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'REPAIR-PRODUCTION-BASELINE'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check production configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo 'Production Supabase credentials or project ref are missing or invalid.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Show migration history before repair
        run: supabase migration list --linked
      # The 20260928 migrations were previously applied outside the CLI. This
      # repairs history only; it does not rerun their DDL or touch game data.
      - name: Record verified baseline migrations
        run: supabase migration repair --linked --status applied 202609280001 202609280002 202609280003
      - name: Show pending migrations
        run: supabase db push --linked --skip-vault --dry-run --yes
      - name: Apply dice migrations
        run: supabase db push --linked --skip-vault --yes
      - name: Verify migration history
        run: supabase migration list --linked
